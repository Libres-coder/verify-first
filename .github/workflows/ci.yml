name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate tests
        run: python tests/test_gate.py
      - name: Smoke test
        run: |
          mkdir -p /tmp/fx/.claude/skills/verify-app/evidence/d
          echo x > /tmp/fx/.claude/skills/verify-app/evidence/d/e.md
          python scripts/verify_gate.py --repo /tmp/fx
